{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="eyebrow">Student account</div>
  <div class="panel mt-2">
    <h1 class="h2 mb-1">Create your account</h1>
    <p class="text-secondary mb-4">Registration is for students. Faculty and admin accounts are managed by an administrator.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label" for="full_name">Full name</label><input class="form-control" id="full_name" name="full_name" maxlength="100" required></div>
      <div class="mb-3"><label class="form-label" for="email">College email</label><input class="form-control" id="email" name="email" type="email" maxlength="254" autocomplete="email" required></div>
      <div class="row"><div class="col-md-6 mb-3"><label class="form-label" for="student_number">Student number</label><input class="form-control" id="student_number" name="student_number" maxlength="30" required></div><div class="col-md-6 mb-3"><label class="form-label" for="department">Department</label><input class="form-control" id="department" name="department" maxlength="80" required></div></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required><div class="form-text">Use at least 8 characters.</div></div>
      <button class="btn btn-primary w-100" type="submit">Register</button>
    </form>
    <p class="mt-3 mb-0">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
