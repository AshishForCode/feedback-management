{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="eyebrow">Student Feedback Management System</div>
  <div class="panel mt-2">
    <h1 class="h2 mb-1">Welcome back</h1>
    <p class="text-secondary mb-4">Sign in to your campus account.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" maxlength="254" autocomplete="username" required></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary w-100" type="submit">Log in</button>
    </form>
    <p class="mt-3 mb-0">New student? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
