{% extends 'base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-header">
      <div class="eyebrow">Student Feedback System</div>
      <h1>Sign in</h1>
      <p>Enter your campus account credentials</p>
    </div>

    <!-- Minimal Demo Credentials Helper -->
    <div class="demo-box">
      <div class="demo-box-label">Quick demo autofill</div>
      <div class="demo-chips">
        <button type="button" class="demo-chip" onclick="fillDemo('student@feedback.local', 'DemoPass123!')">
          <span class="role-badge">Student</span> Sam Student
        </button>
        <button type="button" class="demo-chip" onclick="fillDemo('faculty@feedback.local', 'DemoPass123!')">
          <span class="role-badge">Faculty</span> Dr. Ada Faculty
        </button>
        <button type="button" class="demo-chip" onclick="fillDemo('admin@feedback.local', 'DemoPass123!')">
          <span class="role-badge">Admin</span> Administrator
        </button>
      </div>
    </div>

    <form method="post" id="loginForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" name="email" type="email" maxlength="254" autocomplete="username" placeholder="name@feedback.local" required autofocus>
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <div class="input-group">
          <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
          <button class="btn btn-toggle-pw" type="button" onclick="togglePasswordVisibility('password', this)" aria-label="Toggle password visibility">
            <span class="pw-eye-text" style="font-size:0.75rem;">Show</span>
          </button>
        </div>
      </div>

      <div class="mb-4 form-check">
        <input type="checkbox" class="form-check-input" id="remember" name="remember" value="1">
        <label class="form-check-label text-muted small" for="remember">Keep me signed in</label>
      </div>

      <button class="btn btn-primary w-100" type="submit">Sign in</button>
    </form>

    <div class="mt-4 pt-3 border-top text-center text-muted small">
      Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-dark fw-semibold text-decoration-none">Register as a student</a>
    </div>
  </div>
</div>

<script>
function fillDemo(email, password) {
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  emailInput.value = email;
  passwordInput.value = password;
  emailInput.focus();
}

function togglePasswordVisibility(fieldId, btn) {
  const field = document.getElementById(fieldId);
  const textSpan = btn.querySelector('.pw-eye-text');
  if (field.type === 'password') {
    field.type = 'text';
    textSpan.textContent = 'Hide';
  } else {
    field.type = 'password';
    textSpan.textContent = 'Show';
  }
}
</script>
{% endblock %}
