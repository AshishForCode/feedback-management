{% extends 'base.html' %}
{% block title %}Edit user{% endblock %}
{% block content %}
<div class="page-heading"><div><div class="eyebrow">Administration · {{ user.role }}</div><h1>Edit account</h1></div><a class="btn btn-outline-secondary" href="{{ url_for('admin.dashboard') }}">Back</a></div>
<section class="panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3"><label class="form-label" for="full_name">Full name</label><input class="form-control" id="full_name" name="full_name" value="{{ user.full_name }}" maxlength="100" required></div>
  <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" value="{{ user.email }}" maxlength="254" required></div>
  <div class="row"><div class="col-md-6 mb-3"><label class="form-label" for="profile_code">Profile code</label><input class="form-control" id="profile_code" name="profile_code" value="{{ user.profile_code }}" maxlength="30" required></div><div class="col-md-6 mb-3"><label class="form-label" for="department">Department</label><input class="form-control" id="department" name="department" value="{{ user.department }}" maxlength="80" required></div></div>
  <button class="btn btn-primary" type="submit">Save account</button>
</form></section>
{% endblock %}
